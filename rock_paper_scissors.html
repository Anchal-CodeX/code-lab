<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./rock_paper_scissorss.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1 class="title">Rock Paper Scissors</h1>
    <div class="con">
    <div class="score">SCORE
        <div class="player">Player: 0</div>
        <div class="nob">Computer: 0</div>
    </div>
    <div><button class="reset"><img class="reset-img" src="https://cdn-icons-png.flaticon.com/128/3106/3106716.png" ></button></div>
    </div>
    <div class="hand">
    <button class="rock">
        <img class="rocks" src="https://static.vecteezy.com/system/resources/previews/040/733/972/unwatermarked/hand-icon-solid-icon-vector.jpg">
    </button>
    <button class="paper">
        <img class="papers" src="https://static.vecteezy.com/system/resources/previews/083/664/271/unwatermarked/human-hand-silhouette-icon-palm-gesture-representing-stop-or-greeting-signal-vector.jpg">
    </button>
    <button class="scissors">
        <img class="scissorss" src="https://static.vecteezy.com/system/resources/previews/084/732/639/unwatermarked/hand-showing-victory-sign-gesture-as-a-minimal-flat-icon-vector.jpg">
    </button>
    </div>
    <hr style="border-radius: 50%; margin: 40px"></hr>
    <div class="bottom">
    <p class="show">YOU </p>
    <p class="random">COMPUTER </p>
    <div class="result">
        <p class="winner">RESULT : </p>
        </div>
</div>

    <script src="./rock_paper_scissors.js"></script>
</body>
</html>
